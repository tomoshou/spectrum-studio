<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrum Studio</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f26; --panel2: #262932; --line: #343845;
    --text: #e8e9ee; --muted: #8b8fa0; --accent: #5b8cff; --accent2: #ff5b8c; --ok: #4cd08a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 13px; display: flex; flex-direction: column; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  header .file { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: linear-gradient(45deg, #1a1b21 25%, transparent 25%), linear-gradient(-45deg, #1a1b21 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1b21 75%), linear-gradient(-45deg, transparent 75%, #1a1b21 75%);
    background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; background-color: #101115;
  }
  canvas#view { max-width: 100%; max-height: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: block; }
  #drop {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(20,21,26,.82); border: 2px dashed #4a4f60; margin: 20px; border-radius: 14px; color: var(--muted); font-size: 16px;
    pointer-events: none; transition: opacity .2s;
  }
  #drop strong { color: var(--text); font-size: 22px; }
  #drop.hidden { opacity: 0; }
  #drop.over { border-color: var(--accent); background: rgba(91,140,255,.15); opacity: 1; }
  #drop small { font-size: 12px; }
  #drop .btn { pointer-events: auto; }
  aside {
    flex: 0 0 340px; width: 340px; min-width: 0; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden; padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: #3a3f4f transparent;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: #3a3f4f; border-radius: 4px; }
  /* fieldset の既定 min-inline-size:min-content がはみ出しの原因になるため明示的に 0 に */
  fieldset { min-inline-size: 0; min-width: 0; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 10px; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  legend { color: var(--muted); font-size: 11px; letter-spacing: .08em; padding: 0 6px; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row label { flex: 0 0 84px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { flex: 1 1 0; accent-color: var(--accent); min-width: 0; }
  .row .val { flex: 0 0 46px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  select, input[type=number] { flex: 1 1 0; width: 0; min-width: 0; max-width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { flex: 0 0 auto; width: auto; max-height: 48vh; border-left: 0; border-top: 1px solid var(--line); }
  }
  input[type=color] { width: 36px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); padding: 2px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; transition: background .15s; }
  .btn:hover { background: #2f3340; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #6d9aff; }
  .btn.danger { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  #transport { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  #seek { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: center; }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-row .btn { padding: 5px 9px; font-size: 12px; }
  #progress { display: none; flex-direction: column; gap: 6px; }
  #progress.on { display: flex; }
  #bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .1s; }
  #progText { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status { font-size: 12px; color: var(--ok); min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>◎ Spectrum Studio</h1>
  <div class="file" id="fileName">ファイル未読み込み</div>
  <button class="btn" id="openBtn">ファイルを開く</button>
  <input type="file" id="fileInput" accept="audio/*,video/*" hidden>
</header>

<main>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="drop">
      <strong>オーディオファイルをここにドロップ</strong>
      <span>MP3 / WAV / OGG / FLAC / M4A など</span>
      <button class="btn" id="dropOpen">またはファイルを選択</button>
    </div>
  </div>

  <aside>
    <fieldset>
      <legend>プリセット</legend>
      <div class="preset-row">
        <button class="btn" data-preset="linearCenter">線形・中央</button>
        <button class="btn" data-preset="linearBottom">線形・下揃え</button>
        <button class="btn" data-preset="circle">円形</button>
        <button class="btn" data-preset="circleBoth">円形・内外</button>
        <button class="btn" data-preset="wave">波形</button>
        <button class="btn" data-preset="circleWave">円形波形</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>形状</legend>
      <div class="row"><label>スタイル</label>
        <select id="style">
          <option value="linearCenter">線形バー（中央対称）</option>
          <option value="linearBottom">線形バー（下揃え）</option>
          <option value="linearTop">線形バー（上揃え）</option>
          <option value="linearLine">線形ライン（周波数）</option>
          <option value="circle">円形バー（外側）</option>
          <option value="circleInner">円形バー（内側）</option>
          <option value="circleBoth">円形バー（内外対称）</option>
          <option value="circleLine">円形ライン（周波数）</option>
          <option value="wave">波形（時間軸）</option>
          <option value="circleWave">円形波形（時間軸）</option>
        </select>
      </div>
      <div class="row"><label>キャンバス</label>
        <select id="aspect">
          <option value="1920x1080">16:9（1920×1080）</option>
          <option value="1080x1080">1:1（1080×1080）</option>
          <option value="1080x1920">9:16（1080×1920）</option>
          <option value="1280x720">16:9（1280×720）</option>
          <option value="720x720">1:1（720×720）</option>
        </select>
      </div>
      <div class="row"><label>バー本数</label><input type="range" id="bars" min="8" max="256" value="72"><span class="val" id="barsV"></span></div>
      <div class="row"><label>バー幅比</label><input type="range" id="barW" min="5" max="100" value="40"><span class="val" id="barWV"></span></div>
      <div class="row"><label>最大高さ</label><input type="range" id="maxH" min="5" max="100" value="45"><span class="val" id="maxHV"></span></div>
      <div class="row"><label>最小高さ</label><input type="range" id="minH" min="0" max="20" value="2"><span class="val" id="minHV"></span></div>
      <div class="row"><label>内半径</label><input type="range" id="radius" min="5" max="45" value="22"><span class="val" id="radiusV"></span></div>
      <div class="row"><label>回転</label><input type="range" id="rot" min="0" max="360" value="270"><span class="val" id="rotV"></span></div>
      <div class="row"><label>幅（横方向）</label><input type="range" id="span" min="20" max="100" value="80"><span class="val" id="spanV"></span></div>
      <div class="row"><label>丸い端</label><input type="checkbox" id="round" checked></div>
      <div class="row"><label>左右ミラー</label><input type="checkbox" id="mirror"></div>
    </fieldset>

    <fieldset>
      <legend>反応</legend>
      <div class="row"><label>感度</label><input type="range" id="gain" min="20" max="300" value="100"><span class="val" id="gainV"></span></div>
      <div class="row"><label>スムージング</label><input type="range" id="smooth" min="0" max="95" value="75"><span class="val" id="smoothV"></span></div>
      <div class="row"><label>周波数尺度</label>
        <select id="scale"><option value="log">対数（音楽向け）</option><option value="linear">線形</option></select>
      </div>
      <div class="row"><label>最低周波数</label><input type="range" id="fmin" min="20" max="500" value="30"><span class="val" id="fminV"></span></div>
      <div class="row"><label>最高周波数</label><input type="range" id="fmax" min="2000" max="20000" step="100" value="14000"><span class="val" id="fmaxV"></span></div>
    </fieldset>

    <fieldset>
      <legend>色</legend>
      <div class="row"><label>着色</label>
        <select id="colorMode">
          <option value="solid">単色</option>
          <option value="gradLen" selected>グラデーション（内側→外側）</option>
          <option value="gradIdx">グラデーション（並び順）</option>
          <option value="rainbow">虹色（並び順）</option>
        </select>
      </div>
      <div class="row"><label>色1</label><input type="color" id="c1" value="#ffffff"><label style="flex:0 0 32px;text-align:right">色2</label><input type="color" id="c2" value="#5b8cff"></div>
      <div class="row"><label>背景</label><input type="color" id="bgColor" value="#000000"><label style="flex:0 0 auto">透明</label><input type="checkbox" id="bgAlpha"></div>
      <div class="row"><label>発光</label><input type="range" id="glow" min="0" max="40" value="0"><span class="val" id="glowV"></span></div>
      <div class="row"><label>背景画像</label><button class="btn" id="bgImgBtn" style="flex:1">読み込む</button><button class="btn" id="bgImgClear">消去</button><input type="file" id="bgImgInput" accept="image/*" hidden></div>
    </fieldset>

    <fieldset>
      <legend>書き出し</legend>
      <div class="row"><label>FPS</label>
        <select id="fps"><option value="24">24</option><option value="30">30</option><option value="60" selected>60</option></select>
      </div>
      <div class="row"><label>画質</label>
        <select id="quality"><option value="6">標準</option><option value="12" selected>高</option><option value="24">最高</option></select>
      </div>
      <div class="btn-row"><button class="btn primary" id="exportBtn" disabled>MP4 を高速書き出し</button></div>
      <div class="btn-row"><button class="btn" id="pngBtn">PNG スナップショット</button></div>
      <div id="progress">
        <div id="bar"><div id="barFill"></div></div>
        <div id="progText"></div>
        <button class="btn danger" id="cancelBtn">キャンセル</button>
      </div>
      <div id="status"></div>
      <div class="hint" id="exportHint">音声を先に解析し、実時間より高速に MP4（H.264 + AAC）へ変換します。再生は不要です。透明背景は PNG のみ有効です。</div>
    </fieldset>
  </aside>
</main>

<div id="transport">
  <button class="btn" id="playBtn" disabled>▶ 再生</button>
  <span id="time">0:00 / 0:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0" disabled>
</div>

<audio id="audio"></audio>

<script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('view'), ctx = canvas.getContext('2d');
  const audio = $('audio');
  const state = { style: 'linearCenter', w: 1920, h: 1080, exporting: false, cancel: false };
  const FFT_N = 4096, MIN_DB = -100, MAX_DB = -20;
  let actx = null, track = null, bgImg = null; // track: {mono, sr, duration}

  // ---------- UI ----------
  const fmtRange = {
    bars: v => v, barW: v => v + '%', maxH: v => v + '%', minH: v => v + '%', radius: v => v + '%', rot: v => v + '°', span: v => v + '%',
    gain: v => (v / 100).toFixed(2), smooth: v => (v / 100).toFixed(2), fmin: v => v + 'Hz',
    fmax: v => (v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'kHz' : v + 'Hz'), glow: v => v,
  };
  for (const id in fmtRange) {
    const el = $(id), lab = $(id + 'V'), upd = () => lab.textContent = fmtRange[id](+el.value);
    el.addEventListener('input', upd); upd();
  }
  $('style').addEventListener('change', () => state.style = $('style').value);
  $('aspect').addEventListener('change', setCanvasSize);
  function setCanvasSize() {
    const [w, h] = $('aspect').value.split('x').map(Number);
    state.w = w; state.h = h; canvas.width = w; canvas.height = h; fitCanvas();
  }
  function fitCanvas() {
    const st = $('stage'), s = Math.min((st.clientWidth - 40) / state.w, (st.clientHeight - 40) / state.h, 1);
    canvas.style.width = state.w * s + 'px'; canvas.style.height = state.h * s + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  setCanvasSize();

  const presets = {
    linearCenter: { style: 'linearCenter', bars: 72, barW: 40, maxH: 45, minH: 2, span: 80, round: true, mirror: false },
    linearBottom: { style: 'linearBottom', bars: 64, barW: 60, maxH: 60, minH: 1, span: 90, round: true, mirror: false },
    circle:       { style: 'circle', bars: 96, barW: 35, maxH: 30, minH: 2, radius: 22, rot: 270, round: false, mirror: false },
    circleBoth:   { style: 'circleBoth', bars: 120, barW: 30, maxH: 25, minH: 2, radius: 25, rot: 270, round: true, mirror: true },
    wave:         { style: 'wave', maxH: 40, span: 90 },
    circleWave:   { style: 'circleWave', maxH: 25, radius: 25, rot: 270 },
  };
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    const p = presets[b.dataset.preset];
    for (const k in p) {
      const el = $(k); if (!el) continue;
      if (el.type === 'checkbox') el.checked = p[k]; else el.value = p[k];
      el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('change'));
    }
  }));

  // ---------- file loading & analysis ----------
  const drop = $('drop');
  const openFile = () => $('fileInput').click();
  $('openBtn').addEventListener('click', openFile);
  $('dropOpen').addEventListener('click', openFile);
  $('fileInput').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', e => {
    const f = [...e.dataTransfer.files].find(f => /^(audio|video)\//.test(f.type) || /\.(mp3|wav|ogg|flac|m4a|aac|opus|webm|mp4)$/i.test(f.name));
    if (f) loadFile(f);
  });

  async function loadFile(file) {
    if (state.exporting) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    setStatus('解析中…', 'var(--muted)');
    $('fileName').textContent = file.name;
    let buf;
    try { buf = await actx.decodeAudioData(await file.arrayBuffer()); }
    catch (err) { setStatus('デコードできませんでした: ' + err.message, 'var(--accent2)'); return; }
    const ch = buf.numberOfChannels, len = buf.length;
    const mono = new Float32Array(len);
    for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) mono[i] += d[i] / ch; }
    track = { mono, sr: buf.sampleRate, duration: buf.duration, buffer: buf };
    resetSmoothing();
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(file);
    drop.classList.add('hidden');
    $('playBtn').disabled = false; $('seek').disabled = false; $('exportBtn').disabled = false;
    setStatus('読み込み完了', 'var(--ok)');
    audio.play().catch(() => {});
  }

  // FFT (radix-2) --------------------------------------------------
  function makeFFT(N) {

        for (let i = 0; i < N; i += size) for (let j = 0; j < half; j++) {
          const k = j * step, a = i + j, b = a + half;
          const tr = re[b] * cos[k] - im[b] * sin[k], ti = re[b] * sin[k] + im[b] * cos[k];
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        }
      }
      for (let i = 0; i < N / 2; i++) outMag[i] = Math.sqrt(re[i] * re[i] + im[i] * im[i]) / N;
    };
  }
  const fft = makeFFT(FFT_N);
  const window_ = new Float32Array(FFT_N);
  for (let i = 0; i < FFT_N; i++) { const a = 2 * Math.PI * i / FFT_N; window_[i] = 0.42 - 0.5 * Math.cos(a) + 0.08 * Math.cos(2 * a); }
  const frame = new Float32Array(FFT_N), mag = new Float32Array(FFT_N / 2), smoothed = new Float32Array(FFT_N / 2), spec = new Float32Array(FFT_N / 2);
  const timeBuf = new Float32Array(FFT_N);
  function resetSmoothing() { smoothed.fill(0); }

  // 時刻 t 秒におけるスペクトル（0..1、AnalyserNode 相当）
  function spectrumAt(t) {
    if (!track) return spec.fill(0);
    const start = Math.floor(t * track.sr) - FFT_N, m = track.mono, tau = +$('smooth').value / 100;
    for (let i = 0; i < FFT_N; i++) { const k = start + i; frame[i] = (k >= 0 && k < m.length ? m[k] : 0) * window_[i]; }
    fft(frame, mag);
    for (let i = 0; i < mag.length; i++) {
      const s = tau * smoothed[i] + (1 - tau) * mag[i]; smoothed[i] = s;
      const db = 20 * Math.log10(s + 1e-12);
      spec[i] = Math.min(1, Math.max(0, (db - MIN_DB) / (MAX_DB - MIN_DB)));
    }
    return spec;
  }
  function samplesAt(t) {
    if (!track) return timeBuf.fill(0);
    const start = Math.floor(t * track.sr) - FFT_N, m = track.mono;
    for (let i = 0; i < FFT_N; i++) { const k = start + i; timeBuf[i] = k >= 0 && k < m.length ? m[k] : 0; }
    return timeBuf;
  }
  function getBands(t, n) {
    const s = spectrumAt(t), out = new Float32Array(n);
    if (!track) return out;
    const binHz = track.sr / FFT_N, fmin = +$('fmin').value, fmax = Math.min(+$('fmax').value, track.sr / 2 - 1);
    const log = $('scale').value === 'log', gain = +$('gain').value / 100;
    const edge = i => log ? fmin * Math.pow(fmax / fmin, i / n) : fmin + (fmax - fmin) * i / n;
    for (let i = 0; i < n; i++) {
      let lo = Math.floor(edge(i) / binHz), hi = Math.floor(edge(i + 1) / binHz);
      if (hi <= lo) hi = lo + 1;
      let sum = 0, c = 0;
      for (let b = lo; b < hi && b < s.length; b++) { sum += s[b]; c++; }
      out[i] = Math.min(1, (c ? sum / c : 0) * gain * (1 + 0.6 * i / n)); // 高域を軽く持ち上げる
    }
    return out;
  }
  function mirrorBands(b) {
    const n = b.length, half = Math.ceil(n / 2), out = new Float32Array(n);
    for (let i = 0; i < n; i++) { const d = Math.abs(i - (n - 1) / 2); out[i] = b[Math.min(half - 1, Math.floor(d * half / (n / 2)))]; }
    return out;
  }

  // ---------- transport ----------
  const fmtT = t => { t = Math.max(0, t || 0); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
  $('playBtn').addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
  audio.addEventListener('play', () => $('playBtn').textContent = '❚❚ 停止');
  audio.addEventListener('pause', () => $('playBtn').textContent = '▶ 再生');
  let seeking = false;
  audio.addEventListener('timeupdate', () => {
    if (!seeking) $('seek').value = audio.duration ? audio.currentTime / audio.duration * 1000 : 0;
    $('time').textContent = fmtT(audio.currentTime) + ' / ' + fmtT(audio.duration);
  });
  $('seek').addEventListener('input', () => seeking = true);
  $('seek').addEventListener('change', () => { seeking = false; if (audio.duration) audio.currentTime = $('seek').value / 1000 * audio.duration; });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !['INPUT', 'SELECT', 'BUTTON'].includes(e.target.tagName) && audio.src) { e.preventDefault(); $('playBtn').click(); }
  });

  // ---------- background image ----------
  $('bgImgBtn').addEventListener('click', () => $('bgImgInput').click());
  $('bgImgInput').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => bgImg = img; img.src = URL.createObjectURL(f); e.target.value = '';
  });
  $('bgImgClear').addEventListener('click', () => bgImg = null);

  // ---------- color ----------
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  // 並び順（バー番号）に応じた色。内側→外側モードでは色1 を返す（グラデーションは別途 strokeStyle に設定）
  function mixColor(t) {
    const mode = $('colorMode').value;
    if (mode === 'solid' || mode === 'gradLen') return $('c1').value;
    if (mode === 'rainbow') return `hsl(${Math.round(t * 320)},90%,60%)`;
    const a = hexRgb($('c1').value), b = hexRgb($('c2').value);
    return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',')})`;
  }
  const isLenGrad = () => $('colorMode').value === 'gradLen';
  // バーの根元（色1）→先端（色2）のグラデーション。sym=true は中央が根元で両端が先端
  function addStops(g, sym) {
    const c1 = $('c1').value, c2 = $('c2').value;
    if (sym) { g.addColorStop(0, c2); g.addColorStop(0.5, c1); g.addColorStop(1, c2); }
    else { g.addColorStop(0, c1); g.addColorStop(1, c2); }
    return g;
  }
  const linGrad = (x0, y0, x1, y1, sym) => addStops(ctx.createLinearGradient(x0, y0, x1, y1), sym);
  const radGrad = (cx, cy, r0, r1, sym) => addStops(ctx.createRadialGradient(cx, cy, Math.max(0, r0), cx, cy, Math.max(0, r1)), sym);

  // ---------- drawing ----------
  function renderFrame(t, opaque) {
    const W = state.w, H = state.h;
    ctx.clearRect(0, 0, W, H);
    if (opaque || !$('bgAlpha').checked) { ctx.fillStyle = $('bgColor').value; ctx.fillRect(0, 0, W, H); }
    if (bgImg) {
      const s = Math.max(W / bgImg.width, H / bgImg.height), iw = bgImg.width * s, ih = bgImg.height * s;
      ctx.drawImage(bgImg, (W - iw) / 2, (H - ih) / 2, iw, ih);
    }
    const glow = +$('glow').value;
    ctx.shadowBlur = glow; ctx.shadowColor = glow ? $('c1').value : 'transparent';
    ctx.lineCap = $('round').checked ? 'round' : 'butt';
    const st = state.style;
    if (st === 'linearCenter' || st === 'linearBottom' || st === 'linearTop') drawLinearBars(t, W, H, st);
    else if (st === 'linearLine') drawLinearLine(t, W, H);
    else if (st === 'circle' || st === 'circleInner' || st === 'circleBoth') drawCircleBars(t, W, H, st);
    else if (st === 'circleLine') drawCircleLine(t, W, H);
    else if (st === 'wave') drawWave(t, W, H);
    else if (st === 'circleWave') drawCircleWave(t, W, H);
    ctx.shadowBlur = 0;
  }
  function bands(t) { let b = getBands(t, +$('bars').value); if ($('mirror').checked) b = mirrorBands(b); return b; }

  function drawLinearBars(t, W, H, st) {
    const b = bands(t), n = b.length, span = W * $('span').value / 100, x0 = (W - span) / 2, slot = span / n;
    const maxH = H * $('maxH').value / 100, minH = H * $('minH').value / 100;
    ctx.lineWidth = Math.max(1, slot * $('barW').value / 100);
    let grad = null;
    if (isLenGrad()) {
      if (st === 'linearCenter') grad = linGrad(0, H / 2 - maxH / 2, 0, H / 2 + maxH / 2, true);
      else if (st === 'linearBottom') grad = linGrad(0, H / 2 + maxH / 2, 0, H / 2 - maxH / 2, false);
      else grad = linGrad(0, H / 2 - maxH / 2, 0, H / 2 + maxH / 2, false);
    }
    for (let i = 0; i < n; i++) {
      const h = Math.max(minH, b[i] * maxH), x = x0 + slot * (i + 0.5);
      ctx.strokeStyle = grad || mixColor(i / (n - 1)); ctx.beginPath();
      if (st === 'linearCenter') { ctx.moveTo(x, H / 2 - h / 2); ctx.lineTo(x, H / 2 + h / 2); }
      else if (st === 'linearBottom') { const y = H / 2 + maxH / 2; ctx.moveTo(x, y); ctx.lineTo(x, y - h); }
      else { const y = H / 2 - maxH / 2; ctx.moveTo(x, y); ctx.lineTo(x, y + h); }
      ctx.stroke();
    }
  }
  function drawLinearLine(t, W, H) {
    const b = bands(t), n = b.length, span = W * $('span').value / 100, x0 = (W - span) / 2;
    const maxH = H * $('maxH').value / 100, base = H / 2 + maxH / 2;
    ctx.lineWidth = Math.max(2, W * 0.002 * $('barW').value / 20); ctx.lineJoin = 'round';
    ctx.strokeStyle = isLenGrad() ? linGrad(0, base, 0, base - maxH, false) : mixColor(0.5);
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = x0 + span * i / (n - 1), y = base - b[i] * maxH; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    ctx.lineTo(x0 + span, base); ctx.lineTo(x0, base); ctx.closePath();
    const g = ctx.createLinearGradient(0, base - maxH, 0, base);
    g.addColorStop(0, mixColor(1)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.35; ctx.fillStyle = g; ctx.fill(); ctx.globalAlpha = 1;
  }
  function drawCircleBars(t, W, H, st) {
    const b = bands(t), n = b.length, cx = W / 2, cy = H / 2, R = Math.min(W, H), r0 = R * $('radius').value / 100;
    const maxL = R * $('maxH').value / 100, minL = R * $('minH').value / 100, rot = $('rot').value * Math.PI / 180;
    ctx.lineWidth = Math.max(1, 2 * Math.PI * r0 / n * $('barW').value / 100);
    let grad = null;
    if (isLenGrad()) {
      if (st === 'circle') grad = radGrad(cx, cy, r0, r0 + maxL, false);
      else if (st === 'circleInner') { grad = ctx.createRadialGradient(cx, cy, Math.max(0, r0 - maxL), cx, cy, r0); grad.addColorStop(0, $('c2').value); grad.addColorStop(1, $('c1').value); }
      else grad = radGrad(cx, cy, r0 - maxL / 2, r0 + maxL / 2, true);
    }
    for (let i = 0; i < n; i++) {
      const a = rot + i / n * 2 * Math.PI, len = Math.max(minL, b[i] * maxL), ca = Math.cos(a), sa = Math.sin(a);
      let rIn = r0, rOut = r0 + len;
      if (st === 'circleInner') { rIn = r0 - len; rOut = r0; }
      if (st === 'circleBoth') { rIn = r0 - len / 2; rOut = r0 + len / 2; }
      ctx.strokeStyle = grad || mixColor(i / (n - 1)); ctx.beginPath();
      ctx.moveTo(cx + ca * rIn, cy + sa * rIn); ctx.lineTo(cx + ca * rOut, cy + sa * rOut); ctx.stroke();
    }
  }
  function drawCircleLine(t, W, H) {
    const b = bands(t), n = b.length, cx = W / 2, cy = H / 2, R = Math.min(W, H), r0 = R * $('radius').value / 100;
    const maxL = R * $('maxH').value / 100, rot = $('rot').value * Math.PI / 180;
    ctx.lineWidth = Math.max(2, R * 0.003 * $('barW').value / 20); ctx.lineJoin = 'round';
    ctx.strokeStyle = isLenGrad() ? radGrad(cx, cy, r0, r0 + maxL, false) : mixColor(0.5);
    ctx.fillStyle = isLenGrad() ? $('c2').value : mixColor(1);
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = rot + i / n * 2 * Math.PI, r = r0 + b[i % n] * maxL, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.globalAlpha = 0.25; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
  }
  function drawWave(t, W, H) {
    const d = samplesAt(t), span = W * $('span').value / 100, x0 = (W - span) / 2;
    const amp = H * $('maxH').value / 100 / 2 * (+$('gain').value / 100);
    ctx.lineWidth = Math.max(2, W * 0.002 * $('barW').value / 20); ctx.lineJoin = 'round';
    ctx.strokeStyle = isLenGrad() ? linGrad(0, H / 2 - amp, 0, H / 2 + amp, true) : mixColor(0.5);
    ctx.beginPath();
    const step = Math.max(1, Math.floor(d.length / 1024));
    for (let i = 0, k = 0; i < d.length; i += step, k++) { const x = x0 + span * i / (d.length - 1), y = H / 2 + d[i] * amp; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  function drawCircleWave(t, W, H) {
    const d = samplesAt(t), cx = W / 2, cy = H / 2, R = Math.min(W, H), r0 = R * $('radius').value / 100;
    const amp = R * $('maxH').value / 100 * (+$('gain').value / 100), rot = $('rot').value * Math.PI / 180, N = 720;
    ctx.lineWidth = Math.max(2, R * 0.003 * $('barW').value / 20); ctx.lineJoin = 'round';
    ctx.strokeStyle = isLenGrad() ? radGrad(cx, cy, r0 - amp, r0 + amp, true) : mixColor(0.5);
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const s = d[Math.floor(i % N / N * (d.length - 1))], a = rot + i / N * 2 * Math.PI, r = r0 + s * amp;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  // preview loop（書き出し中は停止）
  function previewLoop() {
    requestAnimationFrame(previewLoop);
    if (state.exporting) return;
    renderFrame(audio.currentTime || 0, false);
  }
  requestAnimationFrame(previewLoop);

  // ---------- export ----------
  function setStatus(msg, color) { $('status').textContent = msg; $('status').style.color = color || 'var(--ok)'; }
  // claude.ai の Artifact 上では <a download> が無効なので、保存だけ downloads 経由にする（ローカルでは従来どおり）
  let saveCap = null;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => saveCap = d, () => {});
  async function download(blob, name) {
    if (saveCap) {
      try { await saveCap.save({ filename: name, data: blob }); return true; }
      catch (e) {
        setStatus(e && e.code === 'declined' ? '保存をキャンセルしました' : '保存できませんでした: ' + ((e && e.message) || ''), 'var(--accent2)');
        return false;
      }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    return true;
  }
  const baseName = () => ($('fileName').textContent.replace(/\.[^.]+$/, '') || 'spectrum');
  $('pngBtn').addEventListener('click', () => {
    if (state.exporting) return;
    renderFrame(audio.currentTime || 0, false);
    canvas.toBlob(b => download(b, baseName() + '_spectrum.png'), 'image/png');
  });
  $('cancelBtn').addEventListener('click', () => state.cancel = true);
  $('exportBtn').addEventListener('click', () => exportVideo().catch(err => { console.error(err); setStatus('エラー: ' + err.message, 'var(--accent2)'); finishExport(); }));

  function finishExport() {
    state.exporting = false; state.cancel = false;
    $('progress').classList.remove('on'); $('exportBtn').disabled = false; $('playBtn').disabled = false;
    resetSmoothing();
  }
  const yieldUI = () => new Promise(r => setTimeout(r, 0));
  async function waitQueue(enc, max) { while (enc.encodeQueueSize > max) await yieldUI(); }

  async function pickVideoConfig(W, H, fps, bitrate) {
    const cands = [
      { codec: 'avc1.640033', mux: 'avc', extra: { avc: { format: 'avc' } } },
      { codec: 'avc1.4d0033', mux: 'avc', extra: { avc: { format: 'avc' } } },
      { codec: 'vp09.00.51.08', mux: 'vp9', extra: {} },
      { codec: 'vp09.00.10.08', mux: 'vp9', extra: {} },
    ];
    for (const c of cands) {
      const cfg = { codec: c.codec, width: W, height: H, bitrate, framerate: fps, latencyMode: 'quality', ...c.extra };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return { cfg, mux: c.mux }; } catch {}
    }
    throw new Error('対応する動画コーデックが見つかりません');
  }
  async function pickAudioConfig(sr, ch) {
    for (const c of [{ codec: 'mp4a.40.2', mux: 'aac' }, { codec: 'opus', mux: 'opus' }]) {
      const cfg = { codec: c.codec, sampleRate: sr, numberOfChannels: ch, bitrate: 192000 };
      try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) return { cfg, mux: c.mux }; } catch {}
    }
    throw new Error('対応する音声コーデックが見つかりません');
  }

  async function exportVideo() {
    if (!track || state.exporting) return;
    if (!('VideoEncoder' in window) || !window.Mp4Muxer) {
      setStatus('このブラウザは高速書き出し（WebCodecs）に非対応です。Chrome / Edge をご利用ください。', 'var(--accent2)'); return;
    }
    // 保存先（可能ならディスクへ直接ストリーミング）
    let fileHandle = null;
    if (!saveCap && window.showSaveFilePicker) {
      try {
        fileHandle = await showSaveFilePicker({ suggestedName: baseName() + '_spectrum.mp4', types: [{ description: 'MP4 動画', accept: { 'video/mp4': ['.mp4'] } }] });
      } catch (e) { if (e.name === 'AbortError') return; fileHandle = null; }
    }
    audio.pause();
    state.exporting = true; state.cancel = false;
    $('exportBtn').disabled = true; $('playBtn').disabled = true; $('progress').classList.add('on');
    setStatus('', '');

    const W = state.w, H = state.h, fps = +$('fps').value;
    const bitrate = Math.round(+$('quality').value * 1e6 * (W * H) / (1920 * 1080) * (fps > 30 ? 1.3 : 1));
    const sr = track.sr, ch = Math.min(2, track.buffer.numberOfChannels);
    const v = await pickVideoConfig(W, H, fps, bitrate), a = await pickAudioConfig(sr, ch);

    let writable = null, target;
    if (fileHandle) { writable = await fileHandle.createWritable(); target = new Mp4Muxer.FileSystemWritableFileStreamTarget(writable); }
    else target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target, video: { codec: v.mux, width: W, height: H, frameRate: fps },
      audio: { codec: a.mux, sampleRate: sr, numberOfChannels: ch },
      fastStart: fileHandle ? false : 'in-memory', firstTimestampBehavior: 'offset',
    });
    let encErr = null;
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => encErr = e });
    const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => encErr = e });
    venc.configure(v.cfg); aenc.configure(a.cfg);

    // 音声（全体をチャンクで投入）
    const CH = 4800, total = track.buffer.length;
    for (let pos = 0; pos < total; pos += CH) {
      const n = Math.min(CH, total - pos), data = new Float32Array(n * ch);
      for (let c = 0; c < ch; c++) data.set(track.buffer.getChannelData(c).subarray(pos, pos + n), c * n);
      aenc.encode(new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(pos / sr * 1e6), data }));
      if (aenc.encodeQueueSize > 32) await waitQueue(aenc, 8);
      if (encErr) throw encErr;
    }

    // 映像
    resetSmoothing();
    const frames = Math.ceil(track.duration * fps), t0 = performance.now(), usPerFrame = 1e6 / fps;
    for (let f = 0; f < frames; f++) {
      if (state.cancel) break;
      renderFrame(f / fps, true);
      const vf = new VideoFrame(canvas, { timestamp: Math.round(f * usPerFrame), duration: Math.round(usPerFrame) });
      venc.encode(vf, { keyFrame: f % (fps * 2) === 0 }); vf.close();
      if (venc.encodeQueueSize > 6) await waitQueue(venc, 2);
      if (encErr) throw encErr;
      if (f % 5 === 0) {
        const el = (performance.now() - t0) / 1000, speed = (f + 1) / fps / el;
        $('barFill').style.width = (f + 1) / frames * 100 + '%';
        $('progText').textContent = `${f + 1} / ${frames} フレーム　${(el ? speed : 0).toFixed(1)}× 速　残り約 ${fmtT((frames - f) / fps / Math.max(speed, 0.01))}`;
        await yieldUI();
      }
    }
    const cancelled = state.cancel;
    $('progText').textContent = cancelled ? '中止しています…' : 'エンコードを完了しています…';
    await venc.flush(); await aenc.flush();
    venc.close(); aenc.close();
    if (encErr) throw encErr;
    muxer.finalize();
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    let saved = true;
    if (writable) { await writable.close(); if (cancelled) { try { await fileHandle.remove?.(); } catch {} } }
    else if (!cancelled) saved = await download(new Blob([target.buffer], { type: 'video/mp4' }), baseName() + '_spectrum.mp4');
    if (saved) setStatus(cancelled ? 'キャンセルしました' : `書き出し完了（${sec} 秒、${(track.duration / sec).toFixed(1)}× 速）`, cancelled ? 'var(--muted)' : 'var(--ok)');
    finishExport();
  }
})();
</script>
</body>
</html>
